# https://pnpm.io/settings

# https://pnpm.io/settings/dependency-resolution#minimumreleaseage
# default: 1 Tag = 24 * 60 Minuten
#minimumReleaseAge: 1440
# 1 Woche
#minimumReleaseAge: 10080

# https://pnpm.io/settings/cli#pmonfail
pmOnFail: error

# https://pnpm.io/cli/add#--save-exact--e
saveExact: true

# https://pnpm.io/settings/other#saveprefix
savePrefix: ""

# https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  esbuild: true

# https://pnpm.io/settings/other#dedupedirectdeps
dedupeDirectDeps: true

# Keine Dependencies von Git-Repositories git+ssh://... und von direkten URLs zu TARs https://.../package.tgz
# https://pnpm.io/settings/dependency-resolution#blockexoticsubdeps
blockExoticSubdeps: true

# Kein Unterverzeichnis node_modules/.pnpm, sondern Sym-Links nach $env:LOCALAPPDATA\\pnpm\store\v11
# https://pnpm.io/settings/node-modules#enableglobalvirtualstore
#enableGlobalVirtualStore = true
# Neues Lockfile-Format ab pnpm 12.19 (Anleitung von Herrn Zimmermann)
lockfile:
  format: v13

# GHSA-g3hv-75wg-m249: minimatch in @stylistic/eslint-plugin > eslint, nur Entwicklungswerkzeug,
# ein Fix gibt es erst mit minimatch 11, eslint 10.14 nutzt noch minimatch 10
auditConfig:
  ignoreGhsas: ["GHSA-ggr8-5vv4-36mx", "GHSA-g3hv-75wg-m249"]
